<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="awesome-claude-mods: mods that make Claude Code safer, cheaper and more fun">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8875f"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <g transform="translate(0 110)">

  <!-- left: title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#d97757" font-size="22" font-weight="600" letter-spacing="4">AWESOME</text>
    <text x="70" y="186" fill="#f5efe9" font-size="64" font-weight="800">claude mods</text>
    <rect x="72" y="208" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="262" fill="#cbbfb5" font-size="24">Tested mods that make Claude Code</text>
    <text x="72" y="296" fill="#cbbfb5" font-size="24">safer, cheaper and more fun.</text>
    <text x="72" y="352" fill="#8c8079" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/plugin marketplace add Singh-AP/awesome-claude-mods</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(660 62)">
    <rect width="560" height="300" rx="12" fill="#14100e" stroke="#3a2f29" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="6" fill="#febc2e"/>
    <circle cx="62" cy="22" r="6" fill="#28c840"/>
    <text x="280" y="27" fill="#6f625a" font-size="13" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">claude</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
      <text x="24" y="70" fill="#e8875f">●</text>
      <text x="44" y="70" fill="#f5efe9">Bash(rm -rf ~/)</text>
      <text x="44" y="94" fill="#ff7b72">⎿ bash-guard blocked: recursively deletes ~/</text>
      <text x="24" y="130" fill="#e8875f">●</text>
      <text x="44" y="130" fill="#f5efe9">Bash(cat .env)</text>
      <text x="44" y="154" fill="#8b949e">⎿ OPENAI_API_KEY=[REDACTED:openai-key]</text>
      <text x="24" y="196" fill="#cbbfb5"> /\_/\  </text>
      <text x="24" y="216" fill="#cbbfb5">( ^.^ ) </text>
      <text x="24" y="236" fill="#cbbfb5"> &gt; ^ &lt;  </text>
      <text x="112" y="216" fill="#7ee787">Byte: tests passed! ✓  lvl 7</text>
      <line x1="16" y1="254" x2="544" y2="254" stroke="#3a2f29"/>
      <text x="24" y="282" fill="#8b949e">$0.42 · ctx 38%   ⎇ main ↑2 ●3   ◎ ship login fix</text>
    </g>
  </g>
  </g>
  <text x="640" y="600" fill="#8c8079" font-size="22" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">20 tested mods · 96 curated · 2,378 indexed · github.com/Singh-AP/awesome-claude-mods</text>
