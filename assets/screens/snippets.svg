<text x="18.0" y="76.1" fill="#e6ddd5" textLength="935.7" lengthAdjust="spacing">❯ Review the changes on branch feat/due-dates: the uncommitted ones and the commits not yet on the main branch.</text>
<text x="34.9" y="95.1" fill="#e6ddd5" textLength="370.9" lengthAdjust="spacing">Pay extra attention to: the due-date parsing</text>
<text x="34.9" y="114.1" fill="#e6ddd5" textLength="1222.3" lengthAdjust="spacing">Look for bugs first, then security problems, then needless complexity. List each finding with file:line, most severe first, and say how confident</text>
<text x="34.9" y="133.1" fill="#e6ddd5" textLength="303.5" lengthAdjust="spacing">you are. Do not change any code yet.</text>
