<text x="18.0" y="247.1" fill="rgb(78,78,78)" textLength="927.3" lengthAdjust="spacing">╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌╌</text>
<text x="26.4" y="266.1" fill="#e6ddd5" textLength="429.9" lengthAdjust="spacing">find /tmp/acm-demo -name '*.tmp' -mtime +30 -delete</text>
