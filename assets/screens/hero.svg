<svg xmlns="http://www.w3.org/2000/svg" width="1301" height="574" viewBox="0 0 1301 574" role="img" aria-label="claude — buddy · files-touched · aim · git-pulse · cost-meter terminal screenshot">
<rect width="1301" height="574" rx="10" fill="#14100e"/>
<rect x="0.5" y="0.5" width="1300" height="573" rx="10" fill="none" stroke="#3a2f29"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="650.5" y="22" fill="#6f625a" font-size="13" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">claude — buddy · files-touched · aim · git-pulse · cost-meter</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<rect x="34.9" y="480.0" width="8.9" height="19" fill="#e6ddd5"/>
<text x="18.0" y="57.1" fill="rgb(255,255,255)" textLength="8.4" lengthAdjust="spacing">⏺</text>
<text x="34.9" y="57.1" fill="#e6ddd5" textLength="210.8" lengthAdjust="spacing">I added due dates and an </text>
<text x="245.6" y="57.1" fill="rgb(175,215,255)" textLength="75.9" lengthAdjust="spacing">isOverdue</text>
<text x="329.9" y="57.1" fill="#e6ddd5" textLength="472.1" lengthAdjust="spacing">helper; all 10 tests pass, and the work is committed on </text>
<text x="802.0" y="57.1" fill="rgb(175,215,255)" textLength="118.0" lengthAdjust="spacing">feat/due-dates</text>
<text x="928.4" y="57.1" fill="#e6ddd5" textLength="25.3" lengthAdjust="spacing">as </text>
<text x="953.7" y="57.1" fill="rgb(175,215,255)" textLength="59.0" lengthAdjust="spacing">016b76c</text>
<text x="1012.7" y="57.1" fill="#e6ddd5" textLength="8.4" lengthAdjust="spacing">.</text>
<text x="34.9" y="95.1" fill="#e6ddd5" textLength="16.9" lengthAdjust="spacing">- </text>
<text x="51.7" y="95.1" fill="rgb(175,215,255)" font-weight="700" textLength="244.5" lengthAdjust="spacing">addTodo(list, title, dueDate)</text>
<text x="296.2" y="95.1" fill="#e6ddd5" textLength="413.1" lengthAdjust="spacing">: the due date is optional. Every todo now has a </text>
<text x="709.3" y="95.1" fill="rgb(175,215,255)" textLength="59.0" lengthAdjust="spacing">dueDate</text>
<text x="776.7" y="95.1" fill="#e6ddd5" textLength="118.0" lengthAdjust="spacing">field, set to </text>
<text x="894.7" y="95.1" fill="rgb(175,215,255)" textLength="33.7" lengthAdjust="spacing">null</text>
<text x="936.9" y="95.1" fill="#e6ddd5" textLength="328.8" lengthAdjust="spacing">when none is given. An unparseable date</text>
<text x="51.7" y="114.1" fill="#e6ddd5" textLength="118.0" lengthAdjust="spacing">string throws </text>
<text x="169.7" y="114.1" fill="rgb(175,215,255)" textLength="134.9" lengthAdjust="spacing">invalid due date</text>
<text x="304.6" y="114.1" fill="#e6ddd5" textLength="8.4" lengthAdjust="spacing">.</text>
<text x="34.9" y="133.1" fill="#e6ddd5" textLength="16.9" lengthAdjust="spacing">- </text>
<text x="51.7" y="133.1" fill="rgb(175,215,255)" font-weight="700" textLength="168.6" lengthAdjust="spacing">isOverdue(todo, now)</text>
<text x="220.3" y="133.1" fill="#e6ddd5" textLength="733.4" lengthAdjust="spacing">: true only when the todo isn't done, has a due date, and that date is strictly before </text>
<text x="953.7" y="133.1" fill="rgb(175,215,255)" textLength="25.3" lengthAdjust="spacing">now</text>
<text x="979.0" y="133.1" fill="#e6ddd5" textLength="202.3" lengthAdjust="spacing">. A todo due exactly at </text>
<text x="1181.3" y="133.1" fill="rgb(175,215,255)" textLength="25.3" lengthAdjust="spacing">now</text>
<text x="1215.1" y="133.1" fill="#e6ddd5" textLength="59.0" lengthAdjust="spacing">doesn't</text>
<text x="51.7" y="152.1" fill="#e6ddd5" textLength="151.7" lengthAdjust="spacing">count as overdue. </text>
<text x="203.5" y="152.1" fill="rgb(175,215,255)" textLength="25.3" lengthAdjust="spacing">now</text>
<text x="237.2" y="152.1" fill="#e6ddd5" textLength="75.9" lengthAdjust="spacing">can be a </text>
<text x="313.1" y="152.1" fill="rgb(175,215,255)" textLength="33.7" lengthAdjust="spacing">Date</text>
<text x="355.2" y="152.1" fill="#e6ddd5" textLength="261.3" lengthAdjust="spacing">or a timestamp in milliseconds.</text>
<text x="34.9" y="171.1" fill="#e6ddd5" textLength="16.9" lengthAdjust="spacing">- </text>
<text x="51.7" y="171.1" fill="#e6ddd5" font-weight="700" textLength="42.1" lengthAdjust="spacing">Tests</text>
<text x="93.9" y="171.1" fill="#e6ddd5" textLength="859.9" lengthAdjust="spacing">: I added 8 tests and watched each one fail before writing the code. I also switched the test file to </text>
<text x="953.7" y="171.1" fill="rgb(175,215,255)" textLength="151.7" lengthAdjust="spacing">node:assert/strict</text>
<text x="1105.5" y="171.1" fill="#e6ddd5" textLength="92.7" lengthAdjust="spacing">. The loose</text>
<text x="51.7" y="190.1" fill="rgb(175,215,255)" textLength="101.2" lengthAdjust="spacing">assert.equal</text>
<text x="161.3" y="190.1" fill="#e6ddd5" textLength="59.0" lengthAdjust="spacing">treats </text>
<text x="220.3" y="190.1" fill="rgb(175,215,255)" textLength="75.9" lengthAdjust="spacing">undefined</text>
<text x="304.6" y="190.1" fill="#e6ddd5" textLength="33.7" lengthAdjust="spacing">and </text>
<text x="338.3" y="190.1" fill="rgb(175,215,255)" textLength="33.7" lengthAdjust="spacing">null</text>
<text x="380.5" y="190.1" fill="#e6ddd5" textLength="674.4" lengthAdjust="spacing">as equal, so the "defaults to null" test was passing before the feature existed.</text>
<text x="34.9" y="228.1" fill="#e6ddd5" textLength="160.2" lengthAdjust="spacing">Two things to know:</text>
<text x="34.9" y="247.1" fill="#e6ddd5" textLength="244.5" lengthAdjust="spacing">- The check accepts anything </text>
<text x="279.3" y="247.1" fill="rgb(175,215,255)" textLength="84.3" lengthAdjust="spacing">Date.parse</text>
<text x="372.1" y="247.1" fill="#e6ddd5" textLength="320.3" lengthAdjust="spacing">can read, not only strict ISO strings.</text>
<text x="34.9" y="266.1" fill="#e6ddd5" textLength="219.2" lengthAdjust="spacing">- A date-only string like </text>
<text x="254.0" y="266.1" fill="rgb(175,215,255)" textLength="101.2" lengthAdjust="spacing">'2026-10-05'</text>
<text x="363.6" y="266.1" fill="#e6ddd5" textLength="876.7" lengthAdjust="spacing">is read as midnight UTC, so in timezones behind UTC that todo becomes overdue the evening before its due</text>
<text x="51.7" y="285.1" fill="#e6ddd5" textLength="42.1" lengthAdjust="spacing">date.</text>
<text x="18.0" y="323.1" fill="rgb(148,148,148)" textLength="8.4" lengthAdjust="spacing">✻</text>
<text x="34.9" y="323.1" fill="rgb(148,148,148)" textLength="269.8" lengthAdjust="spacing">Cooked for 1m 43s · done 3:19 PM</text>
<text x="26.4" y="361.1" fill="rgb(255,175,95)" textLength="75.9" lengthAdjust="spacing">/\_/\    </text>
<text x="110.7" y="361.1" fill="#e6ddd5" font-weight="700" textLength="33.7" lengthAdjust="spacing">Byte</text>
<text x="152.9" y="361.1" fill="rgb(148,148,148)" textLength="67.4" lengthAdjust="spacing">Lv 2 cat</text>
<text x="1257.2" y="361.1" fill="rgb(148,148,148)" textLength="25.3" lengthAdjust="spacing">[-]</text>
<text x="18.0" y="380.1" fill="rgb(255,175,95)" textLength="84.3" lengthAdjust="spacing">( o.o )   </text>
<text x="110.7" y="380.1" fill="rgb(255,215,135)" textLength="168.6" lengthAdjust="spacing">█████░░░░░░░░░░░░░░░</text>
<text x="287.8" y="380.1" fill="rgb(148,148,148)" textLength="75.9" lengthAdjust="spacing">75/150 XP</text>
<text x="26.4" y="399.1" fill="rgb(255,175,95)" textLength="75.9" lengthAdjust="spacing">&gt; ^ &lt;    </text>
<text x="110.7" y="399.1" fill="#e6ddd5">👀</text>
<text x="127.6" y="399.1" fill="#e6ddd5" textLength="134.9" lengthAdjust="spacing"> waiting for you</text>
<text x="18.0" y="418.1" fill="rgb(148,148,148)" textLength="210.8" lengthAdjust="spacing">✎ 1 file · todos.js +6 −3</text>
<text x="18.0" y="437.1" fill="rgb(148,148,148)">🎯</text>
<text x="34.9" y="437.1" fill="rgb(148,148,148)" textLength="236.0" lengthAdjust="spacing"> add due dates to todos · 4m</text>
<text x="279.3" y="437.1" fill="#e6ddd5" font-weight="700" textLength="67.4" lengthAdjust="spacing">[ Done ]</text>
<text x="355.2" y="437.1" fill="#e6ddd5" font-weight="700" textLength="75.9" lengthAdjust="spacing">[ Clear ]</text>
<text x="18.0" y="475.1" fill="rgb(128,128,128)" textLength="1264.5" lengthAdjust="spacing">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="494.1" fill="#e6ddd5" textLength="16.9" lengthAdjust="spacing">❯ </text>
<text x="18.0" y="513.1" fill="rgb(128,128,128)" textLength="1264.5" lengthAdjust="spacing">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="34.9" y="532.1" fill="rgb(255,215,0)" textLength="261.3" lengthAdjust="spacing">⚠ git-pulse: ⎇ feat/due-dates ✓</text>
<text x="34.9" y="551.1" fill="rgb(255,215,0)" textLength="118.0" lengthAdjust="spacing">⚠ cost-meter: </text>
<text x="152.9" y="551.1" fill="rgb(255,215,0)">💸</text>
