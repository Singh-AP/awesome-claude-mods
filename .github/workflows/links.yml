name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in every README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --max-retries 3 './**/*.md'
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: links
