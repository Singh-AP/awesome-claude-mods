name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in every README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # catalog/ is rebuilt daily from GitHub (the scan drops gone repos) and its links
          # inside third-party descriptions aren't ours to fix. The template has {{REPO}}
          # placeholders. GitHub answers 404 on /stargazers to anything but a browser.
          args: >-
            --no-progress --max-retries 3
            --exclude-path catalog --exclude-path scripts/README.template.md
            --exclude 'github\.com/.+/stargazers$'
            './**/*.md'
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: links
