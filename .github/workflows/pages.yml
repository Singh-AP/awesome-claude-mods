name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'registry.json'
      - 'mods/**/plugin.json'
      - 'scripts/build-site.mjs'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  # Redeploy after the daily index refresh commits new data.
  workflow_run:
    workflows: ['Refresh mods index']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # After a refresh, build from the branch head, which has the new data.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the site's logic
        run: node --test scripts/test/site.test.mjs

      - name: Build site/data.json and copy images
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
